version: 2

sources: 
  - name: northwind
    description: "Dados brutos do sistema financeiro"
    schema: data_dw
    loader: bigquery

    tables:
      - name: orders
        description: "Tabela de pedidos"
        columns:
          - name: order_id
          - name: customer_id
          - name: employee_id
          - name: order_date
          - name: required_date
          - name: shipped_date
          - name: ship_via
          - name: freight
          - name: ship_name
          - name: ship_address
          - name: ship_city
          - name: ship_region
          - name: ship_postal_code
          - name: ship_country
